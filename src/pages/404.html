<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Freeman Outlet</title>
  <link rel="icon" href="/assets/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --dark: #1A1A1A; --accent: #C9971C; --muted: #6B6B6B; --light: #F5F5F5; --fh: 'Oswald', sans-serif; --fb: 'Work Sans', sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--light); color: var(--dark); font-family: var(--fb); text-align: center; }
    main { max-width: 420px; }
    .code { font-family: var(--fh); font-size: 72px; line-height: 1; color: var(--accent); margin: 0 0 8px; }
    h1 { font-family: var(--fh); font-weight: 500; font-size: 26px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: 12px; background: var(--dark); color: #fff; font-weight: 600; text-decoration: none; }
    a.btn:hover, a.btn:focus-visible { background: var(--accent); color: var(--dark); outline: none; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>We can't find that page</h1>
    <p>The link may be old or mistyped. Your cart is safe &mdash; head back to the shop and carry on.</p>
    <a class="btn" href="/">Back to the shop</a>
  </main>
</body>
</html>
